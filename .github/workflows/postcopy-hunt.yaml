# Temporary: run the postcopy and on demand restore tests on the garm runners
# until one fails, to catch the restored guest hanging.
name: Postcopy hunt
on:
  push:
    branches:
      - 'dev/rbradford/postcopy-hunt'
permissions:
  contents: read
concurrency:
  group: postcopy-hunt
  cancel-in-progress: true
jobs:
  hunt:
    name: hunt (${{ matrix.runner }}, ${{ matrix.kvm }} KVM)
    timeout-minutes: 75
    env:
      PARALLEL_INTEGRATION_TESTS_NUM: 16
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: garm-noble, kvm: patched}
          - {runner: garm-noble, kvm: rebuilt}
          - {runner: garm-noble-amd, kvm: patched}
          - {runner: garm-noble-amd, kvm: rebuilt}
    runs-on: ${{ format('{0}-16', matrix.runner) }}
    steps:
      - name: Code checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Docker
        run: |
          set -eufo pipefail
          sudo apt-get update
          sudo apt-get -y install ca-certificates curl gnupg
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
          sudo chmod a+r /usr/share/keyrings/docker-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          sudo apt-get update
          sudo apt install -y docker-ce docker-ce-cli
      - name: Install xfsprogs
        run: sudo apt-get -y install xfsprogs
      - name: Rebuild the KVM modules of the runner's kernel (${{ matrix.kvm }}) and load them
        run: |
          set -eufo pipefail
          r=$(uname -r)
          cat /proc/version
          cat /proc/version_signature || true
          cat /sys/kernel/security/lockdown || true
          mokutil --sb-state || true
          grep -E '^CONFIG_(KVM|KVM_X86|KVM_INTEL|KVM_AMD|MODVERSIONS|MODULE_SIG_FORCE)=' "/boot/config-$r" || true
          lsmod | grep -E '^(kvm|irqbypass|ccp)' || true
          src=$(dpkg-query -W -f='${source:Package}=${source:Version}' "linux-modules-$r")
          gcc=$(sed -n 's/.*-gcc-\([0-9][0-9]*\) .*/gcc-\1/p' /proc/version)
          echo "kernel source $src, built with $gcc"
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update -q
          sudo apt-get -y -q install dpkg-dev build-essential bc bison flex libelf-dev libssl-dev libdw-dev dwarves "$gcc" "linux-headers-$r"
          mkdir ~/kvm-src
          cd ~/kvm-src
          apt-get source -q --only-source "$src" > /dev/null
          cd "$(find . -mindepth 1 -maxdepth 1 -type d)"
          if [ "${{ matrix.kvm }}" = patched ]; then
            patch -p1 < "$GITHUB_WORKSPACE/hunt-kvm-pv-unhalted.patch"
          fi
          cp "/boot/config-$r" .config
          cp "/usr/src/linux-headers-$r/Module.symvers" .
          k="CC=$gcc HOSTCC=$gcc KERNELRELEASE=$r"
          make -s $k olddefconfig
          make -s $k -j"$(nproc)" modules_prepare
          make -s $k -j"$(nproc)" M=arch/x86/kvm modules
          stock=$(modinfo -F vermagic kvm)
          built=$(modinfo -F vermagic arch/x86/kvm/kvm.ko)
          echo "vermagic: stock '$stock', built '$built'"
          [ "$stock" = "$built" ]
          if grep -q -w vmx /proc/cpuinfo; then v=intel; else v=amd; fi
          for d in $(modinfo -F depends kvm | tr , ' ') $(modinfo -F depends "kvm_$v" | tr , ' '); do
            [ "$d" = kvm ] || sudo modprobe "$d"
          done
          sudo rmmod "kvm_$v" kvm
          sudo insmod arch/x86/kvm/kvm.ko
          sudo insmod "arch/x86/kvm/kvm-$v.ko"
          lsmod | grep -E '^kvm'
          sudo dmesg | tail -n 5
          ls -la /dev/kvm
      - name: Trace the KVM spinlock kicks and vCPU wakeups
        run: |
          set -eufo pipefail
          uname -a
          sudo sh -c '
            t=/sys/kernel/tracing
            echo 0 > $t/tracing_on
            echo > $t/trace
            echo 32768 > $t/buffer_size_kb
            echo 8192 > $t/saved_cmdlines_size
            echo mono > $t/trace_clock
            echo "nr == 5" > $t/events/kvm/kvm_hypercall/filter
            echo "dm == 768" > $t/events/kvm/kvm_apic_accept_irq/filter
            for e in kvm_hypercall kvm_apic_accept_irq kvm_vcpu_wakeup kvm_async_pf_not_present kvm_async_pf_ready kvm_async_pf_completed kvm_async_pf_repeated_fault; do
              echo 1 > $t/events/kvm/$e/enable
            done
            echo 1 > $t/tracing_on
          '
      - name: Run the postcopy and on demand restore tests until one fails
        timeout-minutes: 50
        run: scripts/dev_cli.sh tests --integration --ci --libc gnu
      - name: Upload integration test telemetry
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: telemetry-${{ matrix.runner }}
          path: |
            ~/workloads/telemetry
            ~/workloads/junit
          if-no-files-found: ignore
