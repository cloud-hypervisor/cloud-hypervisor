# Cloud Hypervisor Workspace
#
# The main crate producing the binaries is in `./cloud-hypervisor`.

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.profiling]
debug = true
inherits = "release"
strip = false

[workspace]
# All except build time heavy integration test infrastructure which is typically
# not needed for development workflows targeting ch-remote and cloud-hypervisor.
default-members = [
  "api_client",
  "arch",
  "block",
  "cloud-hypervisor",
  "devices",
  "event_monitor",
  "hypervisor",
  "net_util",
  "offload_daemon",
  "option_parser",
  "pci",
  # "performance-metrics",
  "rate_limiter",
  "serial_buffer",
  # "test_infra",
  "tracer",
  "vhost_user_block",
  "vhost_user_net",
  "virtio-devices",
  "vm-allocator",
  "vm-device",
  "vm-migration",
  "vm-virtio",
  "vmm",
]
members = [
  "api_client",
  "arch",
  "block",
  "cloud-hypervisor",
  "devices",
  "event_monitor",
  "hypervisor",
  "net_util",
  "offload_daemon",
  "option_parser",
  "pci",
  "performance-metrics",
  "rate_limiter",
  "serial_buffer",
  "test_infra",
  "tracer",
  "vhost_user_block",
  "vhost_user_net",
  "virtio-devices",
  "vm-allocator",
  "vm-device",
  "vm-migration",
  "vm-virtio",
  "vmm",
]
package.edition = "2024"
# Minimum buildable version:
# Keep in sync with version in .github/workflows/build.yaml
# Policy on MSRV (see #4318):
# Can only be bumped if satisfying any of the following:
# a.) A dependency requires it,
# b.) If we want to use a new feature and that MSRV is at least 6 months old,
# c.) There is a security issue that is addressed by the toolchain update.
package.rust-version = "1.89.0"
resolver = "3"

[workspace.dependencies]
# rust-vmm crates
acpi_tables = "0.2.1"
iommufd-bindings = "0.2.0"
iommufd-ioctls = "0.4.0"
kvm-bindings = "0.14.2"
kvm-ioctls = "0.25.1"
linux-loader = { version = "0.14.0", default-features = false }
mshv-bindings = "0.7.1"
mshv-ioctls = "0.7.1"
seccompiler = "0.5.0"
vfio-bindings = { version = "0.7.0", default-features = false }
vfio-ioctls = { version = "0.10.0", default-features = false }
vfio_user = { version = "0.1.7", default-features = false }
vhost = { version = "0.17.0", default-features = false }
vhost-user-backend = { version = "0.23.0", default-features = false }
virtio-bindings = "0.2.6"
virtio-queue = "0.18.0"
vm-fdt = { version = "0.3.0", default-features = false }
vm-memory = { version = "0.18.0", default-features = false }
vmm-sys-util = "0.15.0"

# igvm crates
igvm = "0.5.0"
igvm_defs = "0.5.0"

# serde crates
serde = { version = "1.0.228", default-features = false }
serde_json = "1.0.150"
serde_with = { version = "3.19.0", default-features = false }

# other crates
anyhow = { version = "1.0.102", default-features = false }
base64 = { version = "0.23.0", default-features = false }
bitfield-struct = "0.13.0"
bitflags = "2.11.1"
cfg-if = "1.0.4"
clap = { version = "4.6.1", default-features = false }
crc-any = "3.0.0"
dhat = "0.3.3"
dirs = "7.0.0"
env_logger = { version = "0.11.10", default-features = false }
epoll = "4.4.0"
getrandom = { version = "0.4.3", features = ["std"] }
jiff = { version = "0.2", default-features = false, features = [
  "std",
  "tz-system",
  "tzdb-zoneinfo",
] }
libc = "0.2.186"
log = "0.4.30"
rustls = { version = "0.23.46", default-features = false, features = [
  "logging",
  "ring",
  "std",
] }
sha2 = "0.11.0"
signal-hook = "0.4.4"
smallvec = "1.15.1"
thiserror = "2.0.18"
uuid = { version = "1.23.2", default-features = false }
wait-timeout = "0.2.1"
zbus = { version = "5.15.0", default-features = false }
zerocopy = { version = "0.8.50", default-features = false }

[workspace.lints.clippy]
# Any clippy lint (group) in alphabetical order:
# https://rust-lang.github.io/rust-clippy/master/index.html

# Groups
all = "deny"         # shorthand for the other groups but here for compleness
complexity = "deny"
correctness = "deny"
perf = "deny"
style = "deny"
suspicious = "deny"

# Individual Lints
absolute_paths = "deny"
as_ptr_cast_mut = "deny"
assertions_on_result_states = "deny"
cast_ptr_alignment = "deny"
clone_on_ref_ptr = "deny"
if_not_else = "deny"
literal_string_with_formatting_args = "deny"
manual_string_new = "deny"
map_unwrap_or = "deny"
needless_pass_by_value = "deny"
panic = "deny"
ptr_cast_constness = "deny"
redundant_else = "deny"
return_self_not_must_use = "deny"
semicolon_if_nothing_returned = "deny"
undocumented_unsafe_blocks = "deny"
uninlined_format_args = "deny"
unnecessary_semicolon = "deny"

[workspace.lints.rust]
# `level = warn` is irrelevant here but mandatory for rustc/cargo
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(devcli_testenv)'] }
unreachable_pub = "deny"
