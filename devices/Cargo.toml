[package]
authors = ["The Chromium OS Authors"]
edition.workspace = true
name = "devices"
rust-version.workspace = true
version = "0.1.0"

[dependencies]
acpi_tables = { workspace = true }
anyhow = { workspace = true }
arch = { path = "../arch" }
bitfield-struct = { workspace = true, optional = true }
bitflags = { workspace = true }
event_monitor = { path = "../event_monitor" }
getrandom = { workspace = true }
hypervisor = { path = "../hypervisor" }
libc = { workspace = true }
linux-loader = { workspace = true, features = [
  "bzimage",
  "elf",
  "pe",
], optional = true }
log = { workspace = true }
pci = { path = "../pci" }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tpm = { path = "../tpm" }
vm-allocator = { path = "../vm-allocator" }
vm-device = { path = "../vm-device" }
vm-memory = { workspace = true, features = [
  "backend-atomic",
  "backend-bitmap",
  "backend-mmap",
] }
vm-migration = { path = "../vm-migration" }
vmm-sys-util = { workspace = true }
zerocopy = { workspace = true, features = ["alloc", "derive"], optional = true }

[target.'cfg(target_arch = "aarch64")'.dependencies]
iommufd-bindings = { workspace = true }
iommufd-ioctls = { workspace = true }

[features]
default = []
fw_cfg = ["arch/fw_cfg", "bitfield-struct", "linux-loader", "zerocopy"]
ivshmem = []
kvm = ["arch/kvm"]
pvmemcontrol = []

[lints]
workspace = true
